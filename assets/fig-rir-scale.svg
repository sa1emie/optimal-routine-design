<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><defs><marker id="arrB" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="6.4" markerHeight="6.4" orient="auto"><path d="M1,1 L9,5 L1,9 z" fill="#2563eb"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="6.4" markerHeight="6.4" orient="auto"><path d="M1,1 L9,5 L1,9 z" fill="#64748b"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="6.4" markerHeight="6.4" orient="auto"><path d="M1,1 L9,5 L1,9 z" fill="#e11d48"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="6.4" markerHeight="6.4" orient="auto"><path d="M1,1 L9,5 L1,9 z" fill="#b45309"/></marker></defs><rect x="1" y="1" width="998" height="578" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" opacity="1"/><text x="30" y="46" font-size="22" fill="#0f172a" font-weight="700" text-anchor="start" opacity="1">Effort: reading the reps-in-reserve scale</text><text x="30" y="72" font-size="13.5" fill="#64748b" font-weight="400" text-anchor="start" opacity="1">How close a set ends to failure shifts the stimulus, the fatigue it costs, and the job the set does in the week.</text><rect x="354.0" y="142" width="366.0" height="278" rx="0" fill="#2563eb" stroke="none" stroke-width="0" opacity="0.055"/><rect x="598.0" y="142" width="122.0" height="278" rx="0" fill="#e11d48" stroke="none" stroke-width="0" opacity="0.05"/><line x1="110" y1="420" x2="720" y2="420" stroke="#94a3b8" stroke-width="2.5" opacity="1" stroke-linecap="round"/><line x1="110" y1="420" x2="110" y2="144" stroke="#94a3b8" stroke-width="2.5" opacity="1" stroke-linecap="round"/><line x1="720.0" y1="420" x2="720.0" y2="427" stroke="#cbd5e1" stroke-width="2" opacity="1" stroke-linecap="round"/><text x="720.0" y="444" font-size="12.5" fill="#64748b" font-weight="400" text-anchor="middle" opacity="1">0</text><line x1="598.0" y1="420" x2="598.0" y2="427" stroke="#cbd5e1" stroke-width="2" opacity="1" stroke-linecap="round"/><text x="598.0" y="444" font-size="12.5" fill="#64748b" font-weight="400" text-anchor="middle" opacity="1">1</text><line x1="476.0" y1="420" x2="476.0" y2="427" stroke="#cbd5e1" stroke-width="2" opacity="1" stroke-linecap="round"/><text x="476.0" y="444" font-size="12.5" fill="#64748b" font-weight="400" text-anchor="middle" opacity="1">2</text><line x1="354.0" y1="420" x2="354.0" y2="427" stroke="#cbd5e1" stroke-width="2" opacity="1" stroke-linecap="round"/><text x="354.0" y="444" font-size="12.5" fill="#64748b" font-weight="400" text-anchor="middle" opacity="1">3</text><line x1="232.0" y1="420" x2="232.0" y2="427" stroke="#cbd5e1" stroke-width="2" opacity="1" stroke-linecap="round"/><text x="232.0" y="444" font-size="12.5" fill="#64748b" font-weight="400" text-anchor="middle" opacity="1">4</text><line x1="110.0" y1="420" x2="110.0" y2="427" stroke="#cbd5e1" stroke-width="2" opacity="1" stroke-linecap="round"/><text x="110.0" y="444" font-size="12.5" fill="#64748b" font-weight="400" text-anchor="middle" opacity="1">5</text><text x="720.0" y="464" font-size="12" fill="#e11d48" font-weight="600" text-anchor="middle" opacity="1">failure</text><text x="375.0" y="464" font-size="13" fill="#475569" font-weight="400" text-anchor="middle" opacity="1">reps left in the tank when the set ended</text><polyline points="110.0,298.5 122.2,284.3 134.4,277.0 146.6,271.0 158.8,265.9 171.0,261.2 183.2,256.9 195.4,252.9 207.6,249.0 219.8,245.4 232.0,242.0 244.2,238.6 256.4,235.4 268.6,232.3 280.8,229.3 293.0,226.4 305.2,223.5 317.4,220.8 329.6,218.1 341.8,215.4 354.0,212.8 366.2,210.3 378.4,207.8 390.6,205.3 402.8,202.9 415.0,200.5 427.2,198.2 439.4,195.9 451.6,193.6 463.8,191.4 476.0,189.2 488.2,187.0 500.4,184.9 512.6,182.8 524.8,180.7 537.0,178.6 549.2,176.6 561.4,174.5 573.6,172.5 585.8,170.6 598.0,168.6 610.2,166.7 622.4,164.7 634.6,162.8 646.8,161.0 659.0,159.1 671.2,157.2 683.4,155.4 695.6,153.6 707.8,151.8 720.0,150.0" fill="none" stroke="#2563eb" stroke-width="4" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><polyline points="110.0,393.0 122.2,393.0 134.4,392.9 146.6,392.8 158.8,392.7 171.0,392.4 183.2,392.0 195.4,391.5 207.6,390.9 219.8,390.2 232.0,389.3 244.2,388.3 256.4,387.1 268.6,385.7 280.8,384.1 293.0,382.4 305.2,380.4 317.4,378.3 329.6,375.9 341.8,373.4 354.0,370.6 366.2,367.5 378.4,364.3 390.6,360.7 402.8,357.0 415.0,352.9 427.2,348.6 439.4,344.0 451.6,339.2 463.8,334.0 476.0,328.6 488.2,322.9 500.4,316.8 512.6,310.5 524.8,303.8 537.0,296.9 549.2,289.6 561.4,281.9 573.6,274.0 585.8,265.6 598.0,257.0 610.2,247.9 622.4,238.6 634.6,228.8 646.8,218.7 659.0,208.2 671.2,197.4 683.4,186.1 695.6,174.5 707.8,162.4 720.0,150.0" fill="none" stroke="#e11d48" stroke-width="4" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><text x="118" y="290" font-size="12.5" fill="#2563eb" font-weight="600" text-anchor="start" opacity="1">growth stimulus</text><text x="462" y="322" font-size="12.5" fill="#e11d48" font-weight="600" text-anchor="start" opacity="1">fatigue cost</text><text x="537" y="402" font-size="12.5" fill="#2563eb" font-weight="600" text-anchor="middle" opacity="1">0-3 RIR: where most growth happens</text><rect x="742" y="150" width="216" height="340" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" opacity="1"/><text x="760" y="178" font-size="13" fill="#0f172a" font-weight="700" text-anchor="start" opacity="1">CALIBRATING RIR</text><text x="760" y="462" font-size="11" fill="#64748b" font-weight="400" text-anchor="start" opacity="1">Direction from pooled</text><text x="760" y="476" font-size="11" fill="#64748b" font-weight="400" text-anchor="start" opacity="1">meta-regressions, not a fixed rule.</text><rect x="758" y="192.5" width="5" height="5" rx="1.5" fill="#2563eb" stroke="none" stroke-width="0" opacity="1"/><text x="769" y="200" font-size="12" fill="#475569" font-weight="400" text-anchor="start" opacity="1">Anchor against a rep-max</text><text x="769" y="216.5" font-size="12" fill="#475569" font-weight="400" text-anchor="start" opacity="1">table: if 80% of 1RM yields</text><text x="769" y="233.0" font-size="12" fill="#475569" font-weight="400" text-anchor="start" opacity="1">about 8 reps, stopping at 6</text><text x="769" y="249.5" font-size="12" fill="#475569" font-weight="400" text-anchor="start" opacity="1">is roughly RIR 2.</text><rect x="758" y="266.5" width="5" height="5" rx="1.5" fill="#2563eb" stroke="none" stroke-width="0" opacity="1"/><text x="769" y="274.0" font-size="12" fill="#475569" font-weight="400" text-anchor="start" opacity="1">Improving reps at the same</text><text x="769" y="290.5" font-size="12" fill="#475569" font-weight="400" text-anchor="start" opacity="1">load and stated RIR across</text><text x="769" y="307.0" font-size="12" fill="#475569" font-weight="400" text-anchor="start" opacity="1">sessions is the progress</text><text x="769" y="323.5" font-size="12" fill="#475569" font-weight="400" text-anchor="start" opacity="1">signal.</text><rect x="758" y="340.5" width="5" height="5" rx="1.5" fill="#2563eb" stroke="none" stroke-width="0" opacity="1"/><text x="769" y="348.0" font-size="12" fill="#475569" font-weight="400" text-anchor="start" opacity="1">RIR estimates are noisy</text><text x="769" y="364.5" font-size="12" fill="#475569" font-weight="400" text-anchor="start" opacity="1">(often off by 1-2 reps).</text><text x="769" y="381.0" font-size="12" fill="#475569" font-weight="400" text-anchor="start" opacity="1">Growth still rises as sets</text><text x="769" y="397.5" font-size="12" fill="#475569" font-weight="400" text-anchor="start" opacity="1">end nearer failure;</text><text x="769" y="414.0" font-size="12" fill="#475569" font-weight="400" text-anchor="start" opacity="1">strength gains stay similar</text><text x="769" y="430.5" font-size="12" fill="#475569" font-weight="400" text-anchor="start" opacity="1">across a wide range</text><text x="769" y="447.0" font-size="12" fill="#475569" font-weight="400" text-anchor="start" opacity="1">[Robinson et al., 2024].</text><rect x="110" y="480" width="200" height="58" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" opacity="1"/><text x="124" y="502" font-size="12.5" fill="#2563eb" font-weight="700" text-anchor="start" opacity="1">RIR 4-5</text><text x="124" y="519" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start" opacity="1">warm-ups, technique work, and</text><text x="124" y="534" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start" opacity="1">the first weeks of a block</text><rect x="330" y="480" width="210" height="58" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" opacity="1"/><text x="344" y="502" font-size="12.5" fill="#047857" font-weight="700" text-anchor="start" opacity="1">RIR 1-3</text><text x="344" y="519" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start" opacity="1">the default zone for most</text><text x="344" y="534" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start" opacity="1">stable</text><rect x="560" y="480" width="180" height="58" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" opacity="1"/><text x="574" y="502" font-size="12.5" fill="#e11d48" font-weight="700" text-anchor="start" opacity="1">RIR 0</text><text x="574" y="519" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start" opacity="1">sparingly: isolation,</text><text x="574" y="534" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start" opacity="1">machines, or peaking weeks</text><text x="30" y="562" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="start" opacity="1">Curves summarize direction rather than a measured effect size.</text></svg>