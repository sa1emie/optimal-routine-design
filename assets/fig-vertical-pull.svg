t="700" text-anchor="start" opacity="1">JOINT ACTIONS</text><rect x="686" y="251.5" width="5" height="5" rx="1.5" fill="#2563eb" stroke="none" stroke-width="0" opacity="1"/><text x="697" y="259" font-size="13" fill="#475569" font-weight="400" text-anchor="start" opacity="1">Shoulder adduction and extension from</text><text x="697" y="277" font-size="13" fill="#475569" font-weight="400" text-anchor="start" opacity="1">overhead</text><rect x="686" y="290.5" width="5" height="5" rx="1.5" fill="#2563eb" stroke="none" stroke-width="0" opacity="1"/><text x="697" y="298" font-size="13" fill="#475569" font-weight="400" text-anchor="start" opacity="1">Scapular depression</text><text x="686" y="328" font-size="12.5" fill="#64748b" font-weight="700" text-anchor="start" opacity="1">TECHNICAL NOTES</text><rect x="686" y="341.5" width="5" height="5" rx="1.5" fill="#64748b" stroke="none" stroke-width="0" opacity="1"/><text x="697" y="349" font-size="13" fill="#475569" font-weight="400" text-anchor="start" opacity="1">Elbows drive down; bar to the upper chest</text><rect x="686" y="362.5" width="5" height="5" rx="1.5" fill="#64748b" stroke="none" stroke-width="0" opacity="1"/><text x="697" y="370" font-size="13" fill="#475569" font-weight="400" text-anchor="start" opacity="1">Slight torso lean (10-15°); no swinging</text><rect x="686" y="383.5" width="5" height="5" rx="1.5" fill="#64748b" stroke="none" stroke-width="0" opacity="1"/><text x="697" y="391" font-size="13" fill="#475569" font-weight="400" text-anchor="start" opacity="1">Full overhead stretch loads the lats at</text><text x="697" y="409" font-size="13" fill="#475569" font-weight="400" text-anchor="start" opacity="1">long length</text><rect x="686" y="422.5" width="5" height="5" rx="1.5" fill="#64748b" stroke="none" stroke-width="0" opacity="1"/><text x="697" y="430" font-size="13" fill="#475569" font-weight="400" text-anchor="start" opacity="1">Ladder: pull-up, chin-up, lat pulldown,</text><text x="697" y="448" font-size