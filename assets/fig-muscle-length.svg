<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><defs><marker id="arrB" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="6.4" markerHeight="6.4" orient="auto"><path d="M1,1 L9,5 L1,9 z" fill="#2563eb"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="6.4" markerHeight="6.4" orient="auto"><path d="M1,1 L9,5 L1,9 z" fill="#64748b"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="6.4" markerHeight="6.4" orient="auto"><path d="M1,1 L9,5 L1,9 z" fill="#e11d48"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="6.4" markerHeight="6.4" orient="auto"><path d="M1,1 L9,5 L1,9 z" fill="#b45309"/></marker></defs><rect x="1" y="1" width="998" height="618" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" opacity="1"/><text x="30" y="46" font-size="22" fill="#0f172a" font-weight="700" text-anchor="start" opacity="1">Muscle length: where each pattern loads the target longest</text><text x="30" y="72" font-size="13.5" fill="#64748b" font-weight="400" text-anchor="start" opacity="1">Full range matters. The stretched half of each rep is where a muscle tends to grow most when the exercise loads it there.</text><rect x="265.0" y="126" width="65.0" height="166" rx="0" fill="#2563eb" stroke="none" stroke-width="0" opacity="0.06"/><line x1="70" y1="292" x2="330" y2="292" stroke="#94a3b8" stroke-width="2.5" opacity="1" stroke-linecap="round"/><line x1="70" y1="292" x2="70" y2="128" stroke="#94a3b8" stroke-width="2.5" opacity="1" stroke-linecap="round"/><polyline points="96.0,288.7 101.2,288.6 106.4,288.4 111.6,288.2 116.8,288.0 122.0,287.7 127.2,287.4 132.4,286.9 137.6,286.4 142.8,285.8 148.0,285.1 153.2,284.3 158.4,283.5 163.6,282.5 168.8,281.3 174.0,280.1 179.2,278.7 184.4,277.2 189.6,275.6 194.8,273.8 200.0,271.8 205.2,269.7 210.4,267.4 215.6,264.9 220.8,262.3 226.0,259.4 231.2,256.4 236.4,253.1 241.6,249.7 246.8,246.0 252.0,242.2 257.2,238.0 262.4,233.7 267.6,229.1 272.8,224.3 278.0,219.2 283.2,213.8 288.4,208.2 293.6,202.3 298.8,196.1 304.0,189.7 309.2,182.9 314.4,175.8 319.6,168.5 324.8,160.8" fill="none" stroke="#b45309" stroke-width="3" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><polyline points="96.0,178.1 101.2,173.6 106.4,169.3 111.6,165.3 116.8,161.5 122.0,157.9 127.2,154.6 132.4,151.5 137.6,148.6 142.8,145.9 148.0,143.5 153.2,141.3 158.4,139.4 163.6,137.6 168.8,136.1 174.0,134.9 179.2,133.8 184.4,133.0 189.6,132.5 194.8,132.1 200.0,132.0 205.2,132.1 210.4,132.5 215.6,133.0 220.8,133.8 226.0,134.9 231.2,136.1 236.4,137.6 241.6,139.4 246.8,141.3 252.0,143.5 257.2,145.9 262.4,148.6 267.6,151.5 272.8,154.6 278.0,157.9 283.2,161.5 288.4,165.3 293.6,169.3 298.8,173.6 304.0,178.1 309.2,182.8 314.4,187.8 319.6,192.9 324.8,198.4" fill="none" stroke="#2563eb" stroke-width="3" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><text x="70" y="114" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="start" opacity="1">schematic: force capacity vs muscle length</text><rect x="70" y="306" width="10" height="10" rx="2" fill="#2563eb" stroke="none" stroke-width="0" opacity="1"/><text x="86" y="315" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start" opacity="1">active tension</text><rect x="180" y="306" width="10" height="10" rx="2" fill="#b45309" stroke="none" stroke-width="0" opacity="1"/><text x="196" y="315" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start" opacity="1">passive tension</text><text x="70" y="338" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="start" opacity="1">Right band: the stretched zone, where passive tension peaks.</text><rect x="380" y="112" width="570" height="211.0" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" opacity="1"/><text x="398" y="142" font-size="13.5" fill="#0f172a" font-weight="700" text-anchor="start" opacity="1">THE PRACTICAL RULES</text><rect x="398" y="160.5" width="5" height="5" rx="1.5" fill="#2563eb" stroke="none" stroke-width="0" opacity="1"/><text x="409" y="168" font-size="12" fill="#475569" font-weight="400" text-anchor="start" opacity="1">Own the stretched half: control the eccentric; never cut the bottom of the rep</text><text x="409" y="184.5" font-size="12" fill="#475569" font-weight="400" text-anchor="start" opacity="1">short.</text><rect x="398" y="200.5" width="5" height="5" rx="1.5" fill="#2563eb" stroke="none" stroke-width="0" opacity="1"/><text x="409" y="208.0" font-size="12" fill="#475569" font-weight="400" text-anchor="start" opacity="1">Full range is the default. In an 8-week trial, lengthening-focused partials</text><text x="409" y="224.5" font-size="12" fill="#475569" font-weight="400" text-anchor="start" opacity="1">(stretch half only) matched full reps for growth [Wolf et al., 2025].</text><rect x="398" y="240.5" width="5" height="5" rx="1.5" fill="#2563eb" stroke="none" stroke-width="0" opacity="1"/><text x="409" y="248.0" font-size="12" fill="#475569" font-weight="400" text-anchor="start" opacity="1">Tension at long lengths seems favored: overhead triceps extensions grew the</text><text x="409" y="264.5" font-size="12" fill="#475569" font-weight="400" text-anchor="start" opacity="1">long head more than pushdowns did [Maeo et al., 2023; Pedrosa et al., 2026].</text><rect x="398" y="280.5" width="5" height="5" rx="1.5" fill="#2563eb" stroke="none" stroke-width="0" opacity="1"/><text x="409" y="288.0" font-size="12" fill="#475569" font-weight="400" text-anchor="start" opacity="1">Caveat: this is a modifier, not the main driver. Effort, progression and</text><text x="409" y="304.5" font-size="12" fill="#475569" font-weight="400" text-anchor="start" opacity="1">weekly volume still dominate.</text><rect x="60" y="352" width="430" height="72" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" opacity="1"/><text x="76" y="378" font-size="13" fill="#0f172a" font-weight="700" text-anchor="start" opacity="1">Squat / leg press</text><text x="76" y="400" font-size="12" fill="#475569" font-weight="400" text-anchor="start" opacity="1">Targets loaded longest at full depth. Cue: own the bottom</text><text x="76" y="416" font-size="12" fill="#475569" font-weight="400" text-anchor="start" opacity="1">position; no bouncing.</text><rect x="510" y="352" width="430" height="72" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" opacity="1"/><text x="526" y="378" font-size="13" fill="#0f172a" font-weight="700" text-anchor="start" opacity="1">Hinge</text><text x="526" y="400" font-size="12" fill="#475569" font-weight="400" text-anchor="start" opacity="1">Hamstrings longest at the hip-hinge stretch; glutes at</text><text x="526" y="416" font-size="12" fill="#475569" font-weight="400" text-anchor="start" opacity="1">lockout. Cue: control the descent, keep the spine neutral.</text><rect x="60" y="434" width="430" height="72" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" opacity="1"/><text x="76" y="460" font-size="13" fill="#0f172a" font-weight="700" text-anchor="start" opacity="1">Horizontal push</text><text x="76" y="482" font-size="12" fill="#475569" font-weight="400" text-anchor="start" opacity="1">Pecs longest with the bar at the chest. Cue: touch and press;</text><text x="76" y="498" font-size="12" fill="#475569" font-weight="400" text-anchor="start" opacity="1">keep the stretch under control.</text><rect x="510" y="434" width="430" height="72" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" opacity="1"/><text x="526" y="460" font-size="13" fill="#0f172a" font-weight="700" text-anchor="start" opacity="1">Vertical push</text><text x="526" y="482" font-size="12" fill="#475569" font-weight="400" text-anchor="start" opacity="1">Delts work mid-range; no extreme stretch. Cue: full lockout,</text><text x="526" y="498" font-size="12" fill="#475569" font-weight="400" text-anchor="start" opacity="1">controlled descent to ear level.</text><rect x="60" y="516" width="430" height="72" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" opacity="1"/><text x="76" y="542" font-size="13" fill="#0f172a" font-weight="700" text-anchor="start" opacity="1">Horizontal pull</text><text x="76" y="564" font-size="12" fill="#475569" font-weight="400" text-anchor="start" opacity="1">Lats longest with the arms extended. Cue: reach and stretch</text><text x="76" y="580" font-size="12" fill="#475569" font-weight="400" text-anchor="start" opacity="1">each rep; no short yanking.</text><rect x="510" y="516" width="430" height="72" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" opacity="1"/><text x="526" y="542" font-size="13" fill="#0f172a" font-weight="700" text-anchor="start" opacity="1">Vertical pull</text><text x="526" y="564" font-size="12" fill="#475569" font-weight="400" text-anchor="start" opacity="1">Lats longest overhead. Cue: begin from a full hang or long</text><text x="526" y="580" font-size="12" fill="#475569" font-weight="400" text-anchor="start" opacity="1">arms.</text><text x="30" y="602" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="start" opacity="1">Length-based emphasis changes where within a muscle growth happens more than whether it happens. Keep the basics in place.</text></svg>