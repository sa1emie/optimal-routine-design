 stroke-width="4.5" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><polyline points="204,246 206,320" fill="none" stroke="#e11d48" stroke-width="20" opacity="0.3" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="208" cy="250" rx="24" ry="19" fill="#e11d48" opacity="0.24"/><polyline points="204,166 204,246" fill="none" stroke="#0f172a" stroke-width="5" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><polyline points="204,246 206,320" fill="none" stroke="#0f172a" stroke-width="5" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><polyline points="206,320 204,400" fill="none" stroke="#0f172a" stroke-width="5" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><polyline points="204,400 170,400" fill="none" stroke="#0f172a" stroke-width="5" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><polyline points="210,182 246,178" fill="none" stroke="#0f172a" stroke-width="5" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><polyline points="246,178 260,170" fill="none" stroke="#0f172a" stroke-width="5" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><circle cx="204" cy="148" r="15" fill="#0f172a" stroke="none" stroke-width="0" opacity="1"/><line x1="232" y1="170" x2="330" y2="170" stroke="#334155" stroke-width="6" opacity="1" stroke-linecap="round"/><circle cx="232" cy="170" r="16" fill="#dbe3ee" stroke="#8494ab" stroke-width="2" opacity="1"/><circle cx="330" cy="170" r="16" fill="#dbe3ee" stroke="#8494ab" stroke-width="2" opacity="1"/></g><text x="215" y="444" font-size="13" fill="#64748b" font-weight="600" text-anchor="middle" opacity="1">A. BOTTOM POSITION</text><text x="515" y="444" font-size="13" fill="#64748b" font-weight="600" text-anchor="middle" opacity="1">B. STANDING START</text><rect x="668" y="92" width="312" height="445" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" opacity="1"/><text x="686" y="122" font-size="13.5" fill="#0f172a" font-weight="700" text-anchor="start" opacity="1">TECHNICAL NOTES</text><text x="686" y="148" font-size="12.5" fill="#e11d48" font-weight="700" text-anchor="start" opacity="1">PRIME MOVERS</text><rect x="686" y="161.5" width="5" height="5" rx="1.5" fill="#e11d48" stroke="none" stroke-width="0" opacity="1"/><text x="697" y="169" font-size="13" fill="#475569" font-weight="400" text-anchor="start" opacity="1">Quadriceps (all four heads), gluteus</text><text x="697" y="187" font-size="13" fill="#475569" font-weight="400" text-anchor="start" opacity="1">maximus</text><rect x="686" y="200.5" width="5" height="5" rx="1.5" fill="#e11d48" stroke="none" stroke-width="0" opacity="1"/><text x="697" y="208" font-size="13" fill="#475569" font-weight="400" text-anchor="start" opacity="1">Adductor magnus; spinal erectors</text><text x="697" y="226" font-size="13" fill="#475569" font-weight="400" text-anchor="start" opacity="1">(isometric)</text><text x="686" y="256" font-size="12.5" fill="#2563eb" font-weight="700" text-anchor="start" opacity="1">JOINT ACTIONS</text><rect x="686" y="269.5" width="5" height="5" rx="1.5" fill="#2563eb" stroke="none" stroke-width="0" opacity="1"/><text x="697" y="277" font-size="13" fill="#475569" font-weight="400" text-anchor="start" opacity="1">Hip extension, knee extension, ankle</text><text x="697" y="295" font-size="13" fill="#475569" font-weight="400" text-anchor="start" opacity="1">dorsiflexion</text><rect x="686" y="308.5" width="5" height="5" rx="1.5" fill="#2563eb" stroke="none" stroke-width="0" opacity="1"/><text x="697" y="316" font-size="13" fill="#475569" font-weight="400" text-anchor="start" opacity="1">Neutral spine under axial load</text><text x="686" y="346" font-size="12.5" fill="#64748b" font-weight="700" text-anchor="start" opacity="1">TECHNICAL NOTES</text><rect x="686" y="359.5" width="5" height="5" rx="1.5" fill="#64748b" stroke="none" stroke-width="0" opacity="1"/><text x="697" y="367" font-size="13" fill="#475569" font-weight="400" text-anchor="start" opacity="1">Depth: hip crease below the knee line</text><rect x="686" y="380.5" width="5" height="5" rx="1.5" fill="#64748b" stroke="none" stroke-width="0" opacity="1"/><text x="697" y="388" font-size="13" fill="#475569" font-weight="400" text-anchor="start" opacity="1">Bar over the mid-foot; knees track over the</text><text x="697" y="406" font-size="13" fill="#475569" font-weight="400" text-anchor="start" opacity="1">toes</text><rect x="686" y="419.5" width="5" height="5" rx="1.5" fill="#64748b" stroke="none" stroke-width="0" opacity="1"/><text x="697" y="427" font-size="13" fill="#475569" font-weight="400" text-anchor="start" opacity="1">A heel wedge lowers ankle demand if depth</text><text x="697" y="445" font-size="13" fill="#475569" font-weight="400" text-anchor="start" opacity="1">is limited</text><rect x="686" y="458.5" width="5" height="5" rx="1.5" fill="#64748b" stroke="none" stroke-width="0" opacity="1"/><text x="697" y="466" font-size="13" fill="#475569" font-weight="400" text-anchor="start" opacity="1">Pair with hinge work in the week</text><rect x="686" y="479.5" width="5" height="5" rx="1.5" fill="#64748b" stroke="none" stroke-width="0" opacity="1"/><text x="697" y="487" font-size="13" fill="#475569" font-weight="400" text-anchor="start" opacity="1">Ladder: back squat, front squat, hack</text><text x="697" y="505" font-size="13" fill="#475569" font-weight="400" text-anchor="start" opacity="1">squat, leg press</text></svg>