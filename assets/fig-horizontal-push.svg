<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><defs><marker id="arrB" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="6.4" markerHeight="6.4" orient="auto"><path d="M1,1 L9,5 L1,9 z" fill="#2563eb"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="6.4" markerHeight="6.4" orient="auto"><path d="M1,1 L9,5 L1,9 z" fill="#64748b"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="6.4" markerHeight="6.4" orient="auto"><path d="M1,1 L9,5 L1,9 z" fill="#e11d48"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="6.4" markerHeight="6.4" orient="auto"><path d="M1,1 L9,5 L1,9 z" fill="#b45309"/></marker></defs><rect x="1" y="1" width="998" height="538" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" opacity="1"/><text x="30" y="46" font-size="22" fill="#0f172a" font-weight="700" text-anchor="start" opacity="1">3. Horizontal push</text><text x="30" y="72" font-size="14" fill="#64748b" font-weight="400" text-anchor="start" opacity="1">Bar travels toward and away from the chest. Prime movers: pecs, front delts, triceps.</text><line x1="60" y1="402" x2="660" y2="402" stroke="#cbd5e1" stroke-width="3" opacity="1" stroke-linecap="round"/><rect x="66" y="308" width="268" height="14" rx="7" fill="#eef2f7" stroke="#e2e8f0" stroke-width="1.5" opacity="1"/><polyline points="144,322 262,322 240,404 166,404" fill="#e9eef5" stroke="none" stroke-width="5" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><polyline points="276,294 312,316" fill="none" stroke="#94a3b8" stroke-width="4.5" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><polyline points="312,316 322,400" fill="none" stroke="#94a3b8" stroke-width="4.5" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><polyline points="322,400 354,400" fill="none" stroke="#94a3