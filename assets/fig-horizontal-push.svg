="4.5" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><polyline points="312,316 322,400" fill="none" stroke="#94a3b8" stroke-width="4.5" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><polyline points="322,400 354,400" fill="none" stroke="#94a3b8" stroke-width="4.5" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="156" cy="285" rx="26" ry="14" fill="#e11d48" opacity="0.24"/><polyline points="140,287 152,240" fill="none" stroke="#e11d48" stroke-width="11" opacity="0.3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="124,294 276,294" fill="none" stroke="#0f172a" stroke-width="5" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><polyline points="276,294 316,306" fill="none" stroke="#0f172a" stroke-width="5" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><polyline points="316,306 330,400" fill="none" stroke="#0f172a" stroke-width="5" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><polyline points="330,400 364,400" fill="none" stroke="#0f172a" stroke-width="5" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><polyline points="138,289 150,240" fill="none" stroke="#0f172a" stroke-width="5" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><polyline points="150,240 154,204" fill="none" stroke="#0f172a" stroke-width="5" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><circle cx="98" cy="296" r="15" fill="#0f172a" stroke="none" stroke-width="0" opacity="1"/><line x1="100" y1="196" x2="208" y2="196" stroke="#334155" stroke-width="6" opacity="1" stroke-linecap="round"/><circle cx="100" cy="196" r="16" fill="#dbe3ee" stroke="#8494ab" stroke-width="2" opacity="1"/><circle cx="208" cy="196" r="16" fill="#dbe3ee" stroke="#8494ab" stroke-width="2" opacity="1"/></g><text x="215" y="444" font-size="13" fill="#64748b" font-weight="600" text-anchor="middle" opacity="1">A. BAR AT CHEST, ELBOWS 45-70°</text><text x="515" y="444" font-size="13" fill="#64748b" font-weight="600" text-anchor="middle" opacity="1">B. LOCKOUT OVER CHEST</text><rect x="668" y="92" width="312" height="406" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" opacity="1"/><text x="686" y="122" font-size="13.5" fill="#0f172a" font-weight="700" text-anchor="start" opacity="1">TECHNICAL NOTES</text><text x="686" y="148" font-size="12.5" fill="#e11d48" font-weight="700" text-anchor="start" opacity="1">PRIME MOVERS</text><rect x="686" y="161.5" width="5" height="5" rx="1.5" fill="#e11d48" stroke="none" stroke-width="0" opacity="1"/><text x="697" y="169" font-size="13" fill="#475569" font-weight="400" text-anchor="start" opacity="1">Pectoralis major (both heads)</text><rect x="686" y="182.5" width="5" height="5" rx="1.5" fill="#e11d48" stroke="none" stroke-width="0" opacity="1"/><text x="697" y="190" font-size="13" fill="#475569" font-weight="400" text-anchor="start" opacity="1">Anterior deltoid, triceps brachii</text><text x="686" y="220" font-size="12.5" fill="#2563eb" font-weight="700" text-anchor="start" opacity="1">JOINT ACTIONS</text><rect x="686" y="233.5" width="5" height="5" rx="1.5" fill="#2563eb" stroke="none" stroke-width="0" opacity="1"/><text x="697" y="241" font-size="13" fill="#475569" font-weight="400" text-anchor="start" opacity="1">Shoulder horizontal adduction; elbow</text><text x="697" y="259" font-size="13" fill="#475569" font-weight="400" text-anchor="start" opacity="1">extension</text><rect x="686" y="272.5" width="5" height="5" rx="1.5" fill="#2563eb" stroke="none" stroke-width="0" opacity="1"/><text x="697" y="280" font-size="13" fill="#475569" font-weight="400" text-anchor="start" opacity="1">Scapula retracted and pinned to the bench</text><text x="686" y="310" font-size="12.5" fill="#64748b" font-weight="700" text-anchor="start" opacity="1">TECHNICAL NOTES</text><rect x="686" y="323.5" width="5" height="5" rx="1.5" fill="#64748b" stroke="none" stroke-width="0" opacity="1"/><text x="697" y="331" font-size="13" fill="#475569" font-weight="400" text-anchor="start" opacity="1">Forearms vertical at contact; bar to the</text><text x="697" y="349" font-size="13" fill="#475569" font-weight="400" text-anchor="start" opacity="1">lower chest</text><rect x="686" y="362.5" width="5" height="5" rx="1.5" fill="#64748b" stroke="none" stroke-width="0" opacity="1"/><text x="697" y="370" font-size="13" fill="#475569" font-weight="400" text-anchor="start" opacity="1">Elbows about 45-70° from the torso, not</text><text x="697" y="388" font-size="13" fill="#475569" font-weight="400" text-anchor="start" opacity="1">flared to 90°</text><rect x="686" y="401.5" width="5" height="5" rx="1.5" fill="#64748b" stroke="none" stroke-width="0" opacity="1"/><text x="697" y="409" font-size="13" fill="#475569" font-weight="400" text-anchor="start" opacity="1">A 30° incline favors the upper pec; past</text><text x="697" y="427" font-size="13" fill="#475569" font-weight="400" text-anchor="start" opacity="1">45° shifts to the front delts</text><rect x="686" y="440.5" width="5" height="5" rx="1.5" fill="#64748b" stroke="none" stroke-width="0" opacity="1"/><text x="697" y="448" font-size="13" fill="#475569" font-weight="400" text-anchor="start" opacity="1">Ladder: bench press, incline press,</text><text x="697" y="466" font-size="13" fill="#475569" font-weight="400" text-anchor="start" opacity="1">dumbbell press, machine press, push-up</text></svg>