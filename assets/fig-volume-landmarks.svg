52.2,160.6 557.3,159.6 562.4,158.5 567.5,157.4 572.6,156.4 577.7,155.3 582.8,154.3 587.8,153.3 592.9,152.3 598.0,151.3 603.1,150.3 608.2,149.3 613.2,148.4 618.3,147.4 623.4,146.5 628.5,145.5 633.6,144.6 638.7,143.7 643.8,142.8 648.8,141.9 653.9,141.0 659.0,140.1 664.1,139.2 669.2,138.3 674.2,137.5 679.3,136.6 684.4,135.8 689.5,134.9 694.6,134.1 699.7,133.2 704.8,132.4 709.8,131.6 714.9,130.8 720.0,130.0" fill="none" stroke="#2563eb" stroke-width="4" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><polyline points="110.0,130.0 120.2,243.3 130.3,300.0 140.5,334.0 150.7,356.7 160.8,372.9 171.0,385.0 181.2,394.4 191.3,402.0 201.5,408.2 211.7,413.3 221.8,417.7 232.0,421.4 242.2,424.7 252.3,427.5 262.5,430.0 272.7,432.2 282.8,434.2 293.0,436.0 303.2,437.6 313.3,439.1 323.5,440.4 333.7,441.7 343.8,442.8 354.0,443.8 364.2,444.8 374.3,445.7 384.5,446.6 394.7,447.3 404.8,448.1 415.0,448.8 425.2,449.4 435.3,450.0 445.5,450.6 455.7,451.1 465.8,451.6 476.0,452.1 486.2,452.6 496.3,453.0 506.5,453.4 516.7,453.8 526.8,454.2 537.0,454.5 547.2,454.9 557.3,455.2 567.5,455.5 577.7,455.8 587.8,456.1 598.0,456.4 608.2,456.7 618.3,456.9 628.5,457.2 638.7,457.4 648.8,457.6 659.0,457.9 669.2,458.1 679.3,458.3 689.5,458.5 699.7,458.7 709.8,458.9 720.0,459.0" fill="none" stroke="#64748b" stroke-width="2.5" opacity="0.75" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 7"/><text x="560" y="446" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="start" opacity="1">marginal gain per set</text><text x="112" y="122" font-size="12" fill="#64748b" font-weight="400" text-anchor="start" opacity="1">rate of growth (arbitrary units)</text><text x="30" y="540" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="start" opacity="1">Counting: direct sets count 1; indirect sets (a muscle assisting in another movement) count about half [Pelland et al., 2026].</text><circle cx="313.3333333333333" cy="232.58374181284094" r="11" fill="#2563eb" stroke="none" stroke-width="0" opacity="1"/><text x="313.3333333333333" y="237.08374181284094" font-size="12.5" fill="#ffffff" font-weight="700" text-anchor="middle" opacity="1">1</text><rect x="742" y="118" width="216" height="128.5" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" opacity="1"/><circle cx="758" cy="138" r="9" fill="#2563eb" stroke="none" stroke-width="0" opacity="1"/><text x="758" y="142.5" font-size="11" fill="#ffffff" font-weight="700" text-anchor="middle" opacity="1">1</text><text x="773" y="142.5" font-size="12.5" fill="#0f172a" font-weight="700" text-anchor="start" opacity="1">THE DOSE IS GRADED</text><text x="756" y="162.0" font-size="12" fill="#475569" font-weight="400" text-anchor="start" opacity="1">Each added weekly set was tied to</text><text x="756" y="178.5" font-size="12" fill="#475569" font-weight="400" text-anchor="start" opacity="1">a small extra gain, and the 10+</text><text x="756" y="195.0" font-size="12" fill="#475569" font-weight="400" text-anchor="start" opacity="1">sets/wk category trended best</text><text x="756" y="211.5" font-size="12" fill="#475569" font-weight="400" text-anchor="start" opacity="1">(about +3.9% versus lower</text><text x="756" y="228.0" font-size="12" fill="#475569" font-weight="400" text-anchor="start" opacity="1">volumes).</text><circle cx="516.6666666666666" cy="168.56101167937788" r="11" fill="#047857" stroke="none" stroke-width="0" opacity="1"/><text x="516.6666666666666" y="173.06101167937788" font-size="12.5" fill="#ffffff" font-weight="700" text-anchor="middle" opacity="1">2</text><rect x="742" y="258.5" width="216" height="128.5" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" opacity="1"/><circle cx="758" cy="278.5" r="9" fill="#047857" stroke="none" stroke-width="0" opacity="1"/><text x="758" y="283.0" font-size="11" fill="#ffffff" font-weight="700" text-anchor="middle" opacity="1">2</text><text x="773" y="283.0" font-size="12.5" fill="#0f172a" font-weight="700" text-anchor="start" opacity="1">RETURNS FLATTEN</text><text x="756" y="302.5" font-size="12" fill="#475569" font-weight="400" text-anchor="start" opacity="1">The 11th weekly set adds less</text><text x="756" y="319.0" font-size="12" fill="#475569" font-weight="400" text-anchor="start" opacity="1">expected growth than the 10th,</text><text x="756" y="335.5" font-size="12" fill="#475569" font-weight="400" text-anchor="start" opacity="1">and the 21st adds much less</text><text x="756" y="352.0" font-size="12" fill="#475569" font-weight="400" text-anchor="start" opacity="1">again. High volume is earned, not</text><text x="756" y="368.5" font-size="12" fill="#475569" font-weight="400" text-anchor="start" opacity="1">started.</text><circle cx="679.3333333333334" cy="136.60313099010165" r="11" fill="#b45309" stroke="none" stroke-width="0" opacity="1"/><text x="679.3333333333334" y="141.10313099010165" font-size="12.5" fill="#ffffff" font-weight="700" text-anchor="middle" opacity="1">3</text><rect x="742" y="399.0" width="216" height="112.0" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" opacity="1"/><circle cx="758" cy="419.0" r="9" fill="#b45309" stroke="none" stroke-width="0" opacity="1"/><text x="758" y="423.5" font-size="11" fill="#ffffff" font-weight="700" text-anchor="middle" opacity="1">3</text><text x="773" y="423.5" font-size="12.5" fill="#0f172a" font-weight="700" text-anchor="start" opacity="1">COST RISES TOO</text><text x="756" y="443.0" font-size="12" fill="#475569" font-weight="400" text-anchor="start" opacity="1">Past about 20-25 sets per muscle,</text><text x="756" y="459.5" font-size="12" fill="#475569" font-weight="400" text-anchor="start" opacity="1">extra growth is marginal while</text><text x="756" y="476.0" font-size="12" fill="#475569" font-weight="400" text-anchor="start" opacity="1">fatigue, session time and joint</text><text x="756" y="492.5" font-size="12" fill="#475569" font-weight="400" text-anchor="start" opacity="1">load keep climbing.</text></svg>