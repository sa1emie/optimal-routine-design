<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><defs><marker id="arrB" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="6.4" markerHeight="6.4" orient="auto"><path d="M1,1 L9,5 L1,9 z" fill="#2563eb"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="6.4" markerHeight="6.4" orient="auto"><path d="M1,1 L9,5 L1,9 z" fill="#64748b"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="6.4" markerHeight="6.4" orient="auto"><path d="M1,1 L9,5 L1,9 z" fill="#e11d48"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="6.4" markerHeight="6.4" orient="auto"><path d="M1,1 L9,5 L1,9 z" fill="#b45309"/></marker></defs><rect x="1" y="1" width="998" height="658" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" opacity="1"/><text x="30" y="46" font-size="22" fill="#0f172a" font-weight="700" text-anchor="start" opacity="1">Progression: the decision loop</text><text x="30" y="72" font-size="13.5" fill="#64748b" font-weight="400" text-anchor="start" opacity="1">Run this after every working session on the main lifts. It resolves into one action only.</text><rect x="70" y="112" width="320" height="64" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" opacity="1"/><text x="86" y="140.5" font-size="12.5" fill="#0f172a" font-weight="400" text-anchor="start" opacity="1">Did all working sets reach the top of the</text><text x="86" y="157.5" font-size="12.5" fill="#0f172a" font-weight="400" text-anchor="start" opacity="1">rep range at the target effort (RIR)?</text><rect x="70" y="230" width="320" height="64" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" opacity="1"/><text x="86" y="258.5" font-size="12.5" fill="#0f172a" font-weight="400" text-anchor="start" opacity="1">Did reps improve versus last session on at</text><text x="86" y="275.5" font-size="12.5" fill="#0f172a" font-weight="400" text-anchor="start" opacity="1">least one set?</text><rect x="70" y="348" width="320" height="64" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" opacity="1"/><text x="86" y="376.5" font-size="12.5" fill="#0f172a" font-weight="400" text-anchor="start" opacity="1">Same reps at the same effort for 2-3</text><text x="86" y="393.5" font-size="12.5" fill="#0f172a" font-weight="400" text-anchor="start" opacity="1">sessions in a row?</text><rect x="70" y="466" width="320" height="64" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" opacity="1"/><text x="86" y="494.5" font-size="12.5" fill="#0f172a" font-weight="400" text-anchor="start" opacity="1">Is recovery clearly off (sleep, food,</text><text x="86" y="511.5" font-size="12.5" fill="#0f172a" font-weight="400" text-anchor="start" opacity="1">protein, stress)?</text><rect x="470" y="112" width="480" height="64" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" opacity="1"/><rect x="471" y="113" width="6" height="62" rx="3" fill="#047857" stroke="none" stroke-width="0" opacity="1"/><text x="490" y="140.5" font-size="12.5" fill="#475569" font-weight="400" text-anchor="start" opacity="1">PROGRESS. Add load next session: about +2.5-5%, then rebuild</text><text x="490" y="157.5" font-size="12.5" fill="#475569" font-weight="400" text-anchor="start" opacity="1">reps from the bottom of the range.</text><rect x="470" y="230" width="480" height="64" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" opacity="1"/><rect x="471" y="231" width="6" height="62" rx="3" fill="#2563eb" stroke="none" stroke-width="0" opacity="1"/><text x="490" y="258.5" font-size="12.5" fill="#475569" font-weight="400" text-anchor="start" opacity="1">DOUBLE PROGRESSION. Keep the load and add reps across sessions</text><text x="490" y="275.5" font-size="12.5" fill="#475569" font-weight="400" text-anchor="start" opacity="1">until the top of the range, then raise the load.</text><rect x="470" y="348" width="480" height="64" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" opacity="1"/><rect x="471" y="349" width="6" height="62" rx="3" fill="#64748b" stroke="none" stroke-width="0" opacity="1"/><text x="490" y="376.5" font-size="12.5" fill="#475569" font-weight="400" text-anchor="start" opacity="1">NO ACTION. One flat session is noise. Repeat it unchanged; only</text><text x="490" y="393.5" font-size="12.5" fill="#475569" font-weight="400" text-anchor="start" opacity="1">a run of stalls counts as a slowdown.</text><rect x="470" y="466" width="480" height="64" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" opacity="1"/><rect x="471" y="467" width="6" height="62" rx="3" fill="#b45309" stroke="none" stroke-width="0" opacity="1"/><text x="490" y="494.5" font-size="12.5" fill="#475569" font-weight="400" text-anchor="start" opacity="1">FIX RECOVERY FIRST. Hold the load; correct sleep, food and</text><text x="490" y="511.5" font-size="12.5" fill="#475569" font-weight="400" text-anchor="start" opacity="1">stress, then re-run the check in about two weeks.</text><rect x="470" y="540" width="480" height="68" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" opacity="1"/><rect x="471" y="541" width="6" height="66" rx="3" fill="#e11d48" stroke="none" stroke-width="0" opacity="1"/><text x="490" y="562.0" font-size="12.5" fill="#475569" font-weight="400" text-anchor="start" opacity="1">ROTATE THE VARIATION. Move to the next exercise in this slot</text><text x="490" y="579.0" font-size="12.5" fill="#475569" font-weight="400" text-anchor="start" opacity="1">(back squat to front squat). Keep sets and effort; rebuild for</text><text x="490" y="596.0" font-size="12.5" fill="#475569" font-weight="400" text-anchor="start" opacity="1">4-6 weeks.</text><path d="M390,144 Q430.0,156.8 470,144" fill="none" stroke="#2563eb" stroke-width="3.6" marker-end="url(#arrB)"/><text x="398" y="136" font-size="11.5" fill="#047857" font-weight="700" text-anchor="start" opacity="1">YES</text><path d="M230,176 Q221.4,203.0 230,230" fill="none" stroke="#64748b" stroke-width="3.6" marker-end="url(#arrG)"/><text x="238" y="207.0" font-size="11.5" fill="#64748b" font-weight="700" text-anchor="start" opacity="1">NO</text><path d="M390,262 Q430.0,274.8 470,262" fill="none" stroke="#2563eb" stroke-width="3.6" marker-end="url(#arrB)"/><text x="398" y="254" font-size="11.5" fill="#047857" font-weight="700" text-anchor="start" opacity="1">YES</text><path d="M230,294 Q221.4,321.0 230,348" fill="none" stroke="#64748b" stroke-width="3.6" marker-end="url(#arrG)"/><text x="238" y="325.0" font-size="11.5" fill="#64748b" font-weight="700" text-anchor="start" opacity="1">NO</text><path d="M390,380 Q430.0,392.8 470,380" fill="none" stroke="#2563eb" stroke-width="3.6" marker-end="url(#arrB)"/><text x="398" y="372" font-size="11.5" fill="#64748b" font-weight="700" text-anchor="start" opacity="1">NO</text><path d="M230,412 Q221.4,439.0 230,466" fill="none" stroke="#64748b" stroke-width="3.6" marker-end="url(#arrG)"/><text x="238" y="443.0" font-size="11.5" fill="#64748b" font-weight="700" text-anchor="start" opacity="1">YES</text><path d="M390,498 Q430.0,510.8 470,498" fill="none" stroke="#2563eb" stroke-width="3.6" marker-end="url(#arrB)"/><text x="398" y="490" font-size="11.5" fill="#047857" font-weight="700" text-anchor="start" opacity="1">YES</text><line x1="230" y1="530" x2="230" y2="574" stroke="#64748b" stroke-width="3.6" opacity="1" stroke-linecap="round"/><path d="M230,574 Q346.0,611.1 462,574" fill="none" stroke="#64748b" stroke-width="3.6" marker-end="url(#arrG)"/><text x="238" y="552" font-size="11.5" fill="#64748b" font-weight="700" text-anchor="start" opacity="1">NO</text><text x="30" y="636" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="start" opacity="1">After 4-8 weeks in a slot, or when joints ache, swapping variations is normal even without a stall [Kassiano et al., 2022; Fonseca et al., 2014].</text></svg>