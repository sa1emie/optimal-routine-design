<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><defs><marker id="arrB" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="6.4" markerHeight="6.4" orient="auto"><path d="M1,1 L9,5 L1,9 z" fill="#2563eb"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="6.4" markerHeight="6.4" orient="auto"><path d="M1,1 L9,5 L1,9 z" fill="#64748b"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="6.4" markerHeight="6.4" orient="auto"><path d="M1,1 L9,5 L1,9 z" fill="#e11d48"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="6.4" markerHeight="6.4" orient="auto"><path d="M1,1 L9,5 L1,9 z" fill="#b45309"/></marker></defs><rect x="1" y="1" width="998" height="538" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" opacity="1"/><text x="30" y="46" font-size="22" fill="#0f172a" font-weight="700" text-anchor="start" opacity="1">2. Hinge pattern</text><text x="30" y="72" font-size="14" fill="#64748b" font-weight="400" text-anchor="start" opacity="1">Hip-dominant posterior chain. Prime movers: hamstrings, glutes, erectors.</text><line x1="60" y1="402" x2="660" y2="402" stroke="#cbd5e1" stroke-width="3" opacity="1" stroke-linecap="round"/><polyline points="204,246 218,318" fill="none" stroke="#94a3b8" stroke-width="4.5" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><polyline points="218,318 216,400" fill="none" stroke="#94a3b8" stroke-width="4.5" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><polyline points="216,400 182,400" fill="none" stroke="#94a3b8" stroke-width="4.5" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><polyline points="204,246 206,320" fill="none" stroke="#e11d48" stroke-width="18" opacity="0.3" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="208" cy="252" rx="24" ry="19" fill="#e11d48" opacity="0.24"/><polyline points="204,164 204,246" fill="none" stroke="#0f172a" stroke-width="5" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><polyline points="204,246 206,320" fill="none" stroke="#0f172a" stroke-width="5" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><polyline points="206,320 204,400" fill="none" stroke="#0f172a" stroke-width="5" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><polyline points="204,400 170,400" fill="none" stroke="#0f172a" stroke-width="5" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><polyline points="208,180 206,214" fill="none" stroke="#0f172a" stroke-width="5" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><polyline points="206,214 204,254" fill="none" stroke="#0f172a" stroke-width="5" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><circle cx="204" cy="146" r="15" fill="#0f172a" stroke="none" stroke-width="0" opacity="1"/><line x1="150" y1="258" x2="256" y2="258" stroke="#334155" stroke-width="6" opacity="1" stroke-linecap="round"/><circle cx="150" cy="258" r="16" fill="#dbe3ee" stroke="#8494ab" stroke-width="2" opacity="1"/><circle cx="256" cy="258" r="16" fill="#dbe3ee" stroke="#8494ab" stroke-width="2" opacity="1"/><path d="M398,244 Q417.4,307.5 470,348" fill="none" stroke="#2563eb" stroke-width="3.6" marker-end="url(#arrB)"/><g transform="translate(300,0)"><polyline points="272,282 226,338" fill="none" stroke="#94a3b8" stroke-width="4.5" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><polyline points="226,338 220,400" fill="none" stroke="#94a3b8" stroke-width="4.5" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><polyline points="220,400 186,400" fill="none" stroke="#94a3b8" stroke-width="4.5" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><polyline points="272,282 212,330" fill="none" stroke="#e11d48" stroke-width="20" opacity="0.3" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="276" cy="288" rx="24" ry="19" fill="#e11d48" opacity="0.24"/><polyline points="190,234 266,278" fill="none" stroke="#b45309" stroke-width="12" opacity="0.3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="184,238 272,282" fill="none" stroke="#0f172a" stroke-width="5" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><polyline points="272,282 212,330" fill="none" stroke="#0f172a" stroke-width="5" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><polyline points="212,330 206,400" fill="none" stroke="#0f172a" stroke-width="5" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><polyline points="206,400 172,400" fill="none" stroke="#0f172a" stroke-width="5" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><polyline points="190,246 186,296" fill="none" stroke="#0f172a" stroke-width="5" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><polyline points="186,296 182,348" fill="none" stroke="#0f172a" stroke-width="5" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><circle cx="166" cy="222" r="15" fill="#0f172a" stroke="none" stroke-width="0" opacity="1"/><line x1="128" y1="350" x2="236" y2="350" stroke="#334155" stroke-width="6" opacity="1" stroke-linecap="round"/><circle cx="128" cy="350" r="16" fill="#dbe3ee" stroke="#8494ab" stroke-width="2" opacity="1"/><circle cx="236" cy="350" r="16" fill="#dbe3ee" stroke="#8494ab" stroke-width="2" opacity="1"/><line x1="140" y1="212" x2="186" y2="234" stroke="#cbd5e1" stroke-width="1.6" opacity="1" stroke-linecap="round" stroke-dasharray="4 5"/><path d="M276,296 Q297.5,290.8 312,274" fill="none" stroke="#64748b" stroke-width="2.6" marker-end="url(#arrG)"/><text x="278" y="262" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="start" opacity="1">hips travel back</text><text x="64" y="210" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="start" opacity="1">neutral spine</text></g><text x="215" y="444" font-size="13" fill="#64748b" font-weight="600" text-anchor="middle" opacity="1">A. TOP, BAR AT THIGHS</text><text x="515" y="444" font-size="13" fill="#64748b" font-weight="600" text-anchor="middle" opacity="1">B. HINGED, BAR AT SHIN</text><rect x="668" y="92" width="312" height="445" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" opacity="1"/><text x="686" y="122" font-size="13.5" fill="#0f172a" font-weight="700" text-anchor="start" opacity="1">TECHNICAL NOTES</text><text x="686" y="148" font-size="12.5" fill="#e11d48" font-weight="700" text-anchor="start" opacity="1">PRIME MOVERS</text><rect x="686" y="161.5" width="5" height="5" rx="1.5" fill="#e11d48" stroke="none" stroke-width="0" opacity="1"/><text x="697" y="169" font-size="13" fill="#475569" font-weight="400" text-anchor="start" opacity="1">Hamstrings, gluteus maximus, erector spinae</text><rect x="686" y="182.5" width="5" height="5" rx="1.5" fill="#e11d48" stroke="none" stroke-width="0" opacity="1"/><text x="697" y="190" font-size="13" fill="#475569" font-weight="400" text-anchor="start" opacity="1">Grip and forearms maintain the bar</text><text x="686" y="220" font-size="12.5" fill="#2563eb" font-weight="700" text-anchor="start" opacity="1">JOINT ACTIONS</text><rect x="686" y="233.5" width="5" height="5" rx="1.5" fill="#2563eb" stroke="none" stroke-width="0" opacity="1"/><text x="697" y="241" font-size="13" fill="#475569" font-weight="400" text-anchor="start" opacity="1">Hip extension with an almost constant knee</text><text x="697" y="259" font-size="13" fill="#475569" font-weight="400" text-anchor="start" opacity="1">angle</text><rect x="686" y="272.5" width="5" height="5" rx="1.5" fill="#2563eb" stroke="none" stroke-width="0" opacity="1"/><text x="697" y="280" font-size="13" fill="#475569" font-weight="400" text-anchor="start" opacity="1">Spine resists flexion under load</text><text x="686" y="310" font-size="12.5" fill="#64748b" font-weight="700" text-anchor="start" opacity="1">TECHNICAL NOTES</text><rect x="686" y="323.5" width="5" height="5" rx="1.5" fill="#64748b" stroke="none" stroke-width="0" opacity="1"/><text x="697" y="331" font-size="13" fill="#475569" font-weight="400" text-anchor="start" opacity="1">Bar drags along the legs; hips travel back,</text><text x="697" y="349" font-size="13" fill="#475569" font-weight="400" text-anchor="start" opacity="1">not down</text><rect x="686" y="362.5" width="5" height="5" rx="1.5" fill="#64748b" stroke="none" stroke-width="0" opacity="1"/><text x="697" y="370" font-size="13" fill="#475569" font-weight="400" text-anchor="start" opacity="1">Stop at the hamstring stretch limit; keep a</text><text x="697" y="388" font-size="13" fill="#475569" font-weight="400" text-anchor="start" opacity="1">neutral spine</text><rect x="686" y="401.5" width="5" height="5" rx="1.5" fill="#64748b" stroke="none" stroke-width="0" opacity="1"/><text x="697" y="409" font-size="13" fill="#475569" font-weight="400" text-anchor="start" opacity="1">A slight knee bend stays fixed through the</text><text x="697" y="427" font-size="13" fill="#475569" font-weight="400" text-anchor="start" opacity="1">rep</text><rect x="686" y="440.5" width="5" height="5" rx="1.5" fill="#64748b" stroke="none" stroke-width="0" opacity="1"/><text x="697" y="448" font-size="13" fill="#475569" font-weight="400" text-anchor="start" opacity="1">Hips flexing over a near-straight knee</text><text x="697" y="466" font-size="13" fill="#475569" font-weight="400" text-anchor="start" opacity="1">stretches the hamstrings</text><rect x="686" y="479.5" width="5" height="5" rx="1.5" fill="#64748b" stroke="none" stroke-width="0" opacity="1"/><text x="697" y="487" font-size="13" fill="#475569" font-weight="400" text-anchor="start" opacity="1">Ladder: RDL, stiff-leg deadlift, good</text><text x="697" y="505" font-size="13" fill="#475569" font-weight="400" text-anchor="start" opacity="1">morning, back extension, hip thrust</text></svg>