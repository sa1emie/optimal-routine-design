<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" width="1000" height="530" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><defs><marker id="arrB" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="6.4" markerHeight="6.4" orient="auto"><path d="M1,1 L9,5 L1,9 z" fill="#2563eb"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="6.4" markerHeight="6.4" orient="auto"><path d="M1,1 L9,5 L1,9 z" fill="#64748b"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="6.4" markerHeight="6.4" orient="auto"><path d="M1,1 L9,5 L1,9 z" fill="#e11d48"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="6.4" markerHeight="6.4" orient="auto"><path d="M1,1 L9,5 L1,9 z" fill="#b45309"/></marker></defs><rect x="1" y="1" width="998" height="528" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" opacity="1"/><text x="30" y="46" font-size="22" fill="#0f172a" font-weight="700" text-anchor="start" opacity="1">Anatomy of a session</text><text x="30" y="72" font-size="13.5" fill="#64748b" font-weight="400" text-anchor="start" opacity="1">One example skeleton. Compounds come first; anything after the main lift is negotiable and can move between days.</text><text x="82" y="96" font-size="11.5" fill="#64748b" font-weight="700" text-anchor="start" opacity="1">BLOCK</text><text x="280" y="96" font-size="11.5" fill="#64748b" font-weight="700" text-anchor="start" opacity="1">SETS x REPS x EFFORT</text><text x="556" y="96" font-size="11.5" fill="#64748b" font-weight="700" text-anchor="start" opacity="1">REST</text><text x="646" y="96" font-size="11.5" fill="#64748b" font-weight="700" text-anchor="start" opacity="1">JOB IN THE SESSION</text><text x="892" y="96" font-size="11.5" fill="#64748b" font-weight="700" text-anchor="middle" opacity="1">FATIGUE</text><rect x="60" y="108" width="886" height="56" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" opacity="1"/><rect x="61" y="109" width="7" height="54" rx="3" fill="#94a3b8" stroke="none" stroke-width="0" opacity="1"/><text x="82" y="142" font-size="13.5" fill="#0f172a" font-weight="700" text-anchor="start" opacity="1">1. General warm-up</text><text x="280" y="142" font-size="12.5" fill="#475569" font-weight="400" text-anchor="start" opacity="1">5-10 min easy cardio + mobility</text><text x="556" y="142" font-size="12.5" fill="#475569" font-weight="400" text-anchor="start" opacity="1">-</text><text x="646" y="142" font-size="12.5" fill="#475569" font-weight="400" text-anchor="start" opacity="1">Raise temperature; prepare joints</text><circle cx="862" cy="140" r="4.5" fill="#e2e8f0" stroke="none" stroke-width="0" opacity="1"/><circle cx="877" cy="140" r="4.5" fill="#e2e8f0" stroke="none" stroke-width="0" opacity="1"/><circle cx="892" cy="140" r="4.5" fill="#e2e8f0" stroke="none" stroke-width="0" opacity="1"/><circle cx="907" cy="140" r="4.5" fill="#e2e8f0" stroke="none" stroke-width="0" opacity="1"/><circle cx="922" cy="140" r="4.5" fill="#e2e8f0" stroke="none" stroke-width="0" opacity="1"/><rect x="60" y="172" width="886" height="56" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" opacity="1"/><rect x="61" y="173" width="7" height="54" rx="3" fill="#64748b" stroke="none" stroke-width="0" opacity="1"/><text x="82" y="206" font-size="13.5" fill="#0f172a" font-weight="700" text-anchor="start" opacity="1">2. Ramp sets on the first lift</text><text x="280" y="206" font-size="12.5" fill="#475569" font-weight="400" text-anchor="start" opacity="1">bar x8, 40% x5, 60% x3, 80% x1-2</text><text x="556" y="206" font-size="12.5" fill="#475569" font-weight="400" text-anchor="start" opacity="1">45-90 s</text><text x="646" y="206" font-size="12.5" fill="#475569" font-weight="400" text-anchor="start" opacity="1">Groove the pattern</text><circle cx="862" cy="204" r="4.5" fill="#e2e8f0" stroke="none" stroke-width="0" opacity="1"/><circle cx="877" cy="204" r="4.5" fill="#e2e8f0" stroke="none" stroke-width="0" opacity="1"/><circle cx="892" cy="204" r="4.5" fill="#e2e8f0" stroke="none" stroke-width="0" opacity="1"/><circle cx="907" cy="204" r="4.5" fill="#e2e8f0" stroke="none" stroke-width="0" opacity="1"/><circle cx="922" cy="204" r="4.5" fill="#e2e8f0" stroke="none" stroke-width="0" opacity="1"/><rect x="60" y="236" width="886" height="56" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" opacity="1"/><rect x="61" y="237" width="7" height="54" rx="3" fill="#2563eb" stroke="none" stroke-width="0" opacity="1"/><text x="82" y="270" font-size="13.5" fill="#0f172a" font-weight="700" text-anchor="start" opacity="1">3. Main compound</text><text x="280" y="270" font-size="12.5" fill="#475569" font-weight="400" text-anchor="start" opacity="1">3-4 sets x 4-8 reps at RIR 1-3</text><text x="556" y="270" font-size="12.5" fill="#475569" font-weight="400" text-anchor="start" opacity="1">2-3 min</text><text x="646" y="270" font-size="12.5" fill="#475569" font-weight="400" text-anchor="start" opacity="1">Heaviest work; take it while fresh</text><circle cx="862" cy="268" r="4.5" fill="#2563eb" stroke="none" stroke-width="0" opacity="1"/><circle cx="877" cy="268" r="4.5" fill="#2563eb" stroke="none" stroke-width="0" opacity="1"/><circle cx="892" cy="268" r="4.5" fill="#2563eb" stroke="none" stroke-width="0" opacity="1"/><circle cx="907" cy="268" r="4.5" fill="#e2e8f0" stroke="none" stroke-width="0" opacity="1"/><circle cx="922" cy="268" r="4.5" fill="#e2e8f0" stroke="none" stroke-width="0" opacity="1"/><rect x="60" y="300" width="886" height="56" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" opacity="1"/><rect x="61" y="301" width="7" height="54" rx="3" fill="#047857" stroke="none" stroke-width="0" opacity="1"/><text x="82" y="334" font-size="13.5" fill="#0f172a" font-weight="700" text-anchor="start" opacity="1">4. Secondary compound</text><text x="280" y="334" font-size="12.5" fill="#475569" font-weight="400" text-anchor="start" opacity="1">2-3 sets x 6-10 reps at RIR 1-2</text><text x="556" y="334" font-size="12.5" fill="#475569" font-weight="400" text-anchor="start" opacity="1">90-180 s</text><text x="646" y="334" font-size="12.5" fill="#475569" font-weight="400" text-anchor="start" opacity="1">Add volume with less skill demand</text><circle cx="862" cy="332" r="4.5" fill="#047857" stroke="none" stroke-width="0" opacity="1"/><circle cx="877" cy="332" r="4.5" fill="#047857" stroke="none" stroke-width="0" opacity="1"/><circle cx="892" cy="332" r="4.5" fill="#e2e8f0" stroke="none" stroke-width="0" opacity="1"/><circle cx="907" cy="332" r="4.5" fill="#e2e8f0" stroke="none" stroke-width="0" opacity="1"/><circle cx="922" cy="332" r="4.5" fill="#e2e8f0" stroke="none" stroke-width="0" opacity="1"/><rect x="60" y="364" width="886" height="56" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" opacity="1"/><rect x="61" y="365" width="7" height="54" rx="3" fill="#e11d48" stroke="none" stroke-width="0" opacity="1"/><text x="82" y="398" font-size="13.5" fill="#0f172a" font-weight="700" text-anchor="start" opacity="1">5. Isolation or accessory</text><text x="280" y="398" font-size="12.5" fill="#475569" font-weight="400" text-anchor="start" opacity="1">2-4 sets x 8-15 reps at RIR 0-2</text><text x="556" y="398" font-size="12.5" fill="#475569" font-weight="400" text-anchor="start" opacity="1">60-90 s</text><text x="646" y="398" font-size="12.5" fill="#475569" font-weight="400" text-anchor="start" opacity="1">Direct work for the target muscle</text><circle cx="862" cy="396" r="4.5" fill="#e11d48" stroke="none" stroke-width="0" opacity="1"/><circle cx="877" cy="396" r="4.5" fill="#e2e8f0" stroke="none" stroke-width="0" opacity="1"/><circle cx="892" cy="396" r="4.5" fill="#e2e8f0" stroke="none" stroke-width="0" opacity="1"/><circle cx="907" cy="396" r="4.5" fill="#e2e8f0" stroke="none" stroke-width="0" opacity="1"/><circle cx="922" cy="396" r="4.5" fill="#e2e8f0" stroke="none" stroke-width="0" opacity="1"/><rect x="60" y="428" width="886" height="56" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" opacity="1"/><rect x="61" y="429" width="7" height="54" rx="3" fill="#b45309" stroke="none" stroke-width="0" opacity="1"/><text x="82" y="462" font-size="13.5" fill="#0f172a" font-weight="700" text-anchor="start" opacity="1">6. Optional finisher</text><text x="280" y="462" font-size="12.5" fill="#475569" font-weight="400" text-anchor="start" opacity="1">1-2 sets x 12-20 reps at RIR 0-1</text><text x="556" y="462" font-size="12.5" fill="#475569" font-weight="400" text-anchor="start" opacity="1">45-60 s</text><text x="646" y="462" font-size="12.5" fill="#475569" font-weight="400" text-anchor="start" opacity="1">Pump work only if recovery allows</text><circle cx="862" cy="460" r="4.5" fill="#b45309" stroke="none" stroke-width="0" opacity="1"/><circle cx="877" cy="460" r="4.5" fill="#e2e8f0" stroke="none" stroke-width="0" opacity="1"/><circle cx="892" cy="460" r="4.5" fill="#e2e8f0" stroke="none" stroke-width="0" opacity="1"/><circle cx="907" cy="460" r="4.5" fill="#e2e8f0" stroke="none" stroke-width="0" opacity="1"/><circle cx="922" cy="460" r="4.5" fill="#e2e8f0" stroke="none" stroke-width="0" opacity="1"/><text x="30" y="512" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="start" opacity="1">Fatigue dots are rough systemic cost, not a measured scale. Rotate the order within the week so each muscle gets at least one fresh exposure.</text></svg>