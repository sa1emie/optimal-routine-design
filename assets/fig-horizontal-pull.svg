="0" opacity="1"/><text x="697" y="169" font-size="13" fill="#475569" font-weight="400" text-anchor="start" opacity="1">Mid and lower trapezius, rhomboids, lats,</text><text x="697" y="187" font-size="13" fill="#475569" font-weight="400" text-anchor="start" opacity="1">rear delts</text><rect x="686" y="200.5" width="5" height="5" rx="1.5" fill="#e11d48" stroke="none" stroke-width="0" opacity="1"/><text x="697" y="208" font-size="13" fill="#475569" font-weight="400" text-anchor="start" opacity="1">Elbow flexors assist</text><text x="686" y="238" font-size="12.5" fill="#2563eb" font-weight="700" text-anchor="start" opacity="1">JOINT ACTIONS</text><rect x="686" y="251.5" width="5" height="5" rx="1.5" fill="#2563eb" stroke="none" stroke-width="0" opacity="1"/><text x="697" y="259" font-size="13" fill="#475569" font-weight="400" text-anchor="start" opacity="1">Shoulder horizontal abduction and extension</text><rect x="686" y="272.5" width="5" height="5" rx="1.5" fill="#2563eb" stroke="none" stroke-width="0" opacity="1"/><text x="697" y="280" font-size="13" fill="#475569" font-weight="400" text-anchor="start" opacity="1">Scapular retraction and slight depression</text><text x="686" y="310" font-size="12.5" fill="#64748b" font-weight="700" text-anchor="start" opacity="1">TECHNICAL NOTES</text><rect x="686" y="323.5" width="5" height="5" rx="1.5" fill="#64748b" stroke="none" stroke-width="0" opacity="1"/><text x="697" y="331" font-size="13" fill="#475569" font-weight="400" text-anchor="start" opacity="1">Torso stays fixed; bar to the lower ribs,</text><text x="697" y="349" font-size="13" fill="#475569" font-weight="400" text-anchor="start" opacity="1">not the neck</text><rect x="686" y="362.5" width="5" height="5" rx="1.5" fill="#64748b" stroke="none" stroke-width="0" opacity="1"/><text x="697" y="370" font-size="13" fill="#475569" font-weight="400" text-anchor="start" opacity="1">Drive the elbows; the hands are hooks</text><rect x="686" y="383.5" width="5" height="5" rx="1.5" fill="#64748b" stroke="none" stroke-width="0" opacity="1"/><text x="697" y="391" font-size="13" fill="#475569" font-weight="400" text-anchor="start" opacity="1">Chest-supported versions cut spinal fatigue</text><rect x="686" y="404.5" width="5" height="5" rx="1.5" fill="#64748b" stroke="none" stroke-width="0" opacity="1"/><text x="697" y="412" font-size="13" fill="#475569" font-weight="400" text-anchor="start" opacity="1">Ladder: barbell row, chest-supported row,</text><text x="697" y="430" font-size="13" fill="#475569" font-weight="400" text-anchor="start" opacity="1">cable row, one-arm dumbbell row, inverted</text><text x="697" y="448" font-size="13" fill="#475569" font-weight="400" text-anchor="start" opacity="1">row</text></svg>