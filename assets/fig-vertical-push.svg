"round" stroke-linejoin="round"/><polyline points="200,240 202,320" fill="none" stroke="#0f172a" stroke-width="5" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><polyline points="202,320 200,400" fill="none" stroke="#0f172a" stroke-width="5" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><polyline points="200,400 166,400" fill="none" stroke="#0f172a" stroke-width="5" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><polyline points="204,172 212,128" fill="none" stroke="#0f172a" stroke-width="5" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><polyline points="212,128 214,92" fill="none" stroke="#0f172a" stroke-width="5" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><circle cx="188" cy="142" r="15" fill="#0f172a" stroke="none" stroke-width="0" opacity="1"/><line x1="156" y1="86" x2="268" y2="86" stroke="#334155" stroke-width="6" opacity="1" stroke-linecap="round"/><circle cx="156" cy="86" r="16" fill="#dbe3ee" stroke="#8494ab" stroke-width="2" opacity="1"/><circle cx="268" cy="86" r="16" fill="#dbe3ee" stroke="#8494ab" stroke-width="2" opacity="1"/><line x1="224" y1="104" x2="224" y2="400" stroke="#94a3b8" stroke-width="2" opacity="1" stroke-linecap="round" stroke-dasharray="5 7"/><text x="96" y="316" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="start" opacity="1">bar over the mid-foot</text></g><text x="215" y="444" font-size="13" fill="#64748b" font-weight="600" text-anchor="middle" opacity="1">A. RACK POSITION</text><text x="515" y="444" font-size="13" fill="#64748b" font-weight="600" text-anchor="middle" opacity="1">B. OVERHEAD LOCKOUT</text><rect x="668" y="92" width="312" height="406" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" opacity="1"/><text x="686" y="122" font-size="13.5" fill="#0f172a" font-weight="700" text-anchor="start" opacity="1">TECHNICAL NOTES</text><text x="686" y="148" font-size="12.5" fill="#e11d48" font-weight="700" text-anchor="start" opacity="1">PRIME MOVERS</text><rect x="686" y="161.5" width="5" height="5" rx="1.5" fill="#e11d48" stroke="none" stroke-width="0" opacity="1"/><text x="697" y="169" font-size="13" fill="#475569" font-weight="400" text-anchor="start" opacity="1">Deltoids (anterior and middle heads)</text><rect x="686" y="182.5" width="5" height="5" rx="1.5" fill="#e11d48" stroke="none" stroke-width="0" opacity="1"/><text x="697" y="190" font-size="13" fill="#475569" font-weight="400" text-anchor="start" opacity="1">Triceps brachii; upper pectoralis; serratus</text><text x="697" y="208" font-size="13" fill="#475569" font-weight="400" text-anchor="start" opacity="1">anterior</text><text x="686" y="238" font-size="12.5" fill="#2563eb" font-weight="700" text-anchor="start" opacity="1">JOINT ACTIONS</text><rect x="686" y="251.5" width="5" height="5" rx="1.5" fill="#2563eb" stroke="none" stroke-width="0" opacity="1"/><text x="697" y="259" font-size="13" fill="#475569" font-weight="400" text-anchor="start" opacity="1">Shoulder flexion and abduction to overhead</text><rect x="686" y="272.5" width="5" height="5" rx="1.5" fill="#2563eb" stroke="none" stroke-width="0" opacity="1"/><text x="697" y="280" font-size="13" fill="#475569" font-weight="400" text-anchor="start" opacity="1">Elbow extension; scapular upward rotation</text><text x="686" y="310" font-size="12.5" fill="#64748b" font-weight="700" text-anchor="start" opacity="1">TECHNICAL NOTES</text><rect x="686" y="323.5" width="5" height="5" rx="1.5" fill="#64748b" stroke="none" stroke-width="0" opacity="1"/><text x="697" y="331" font-size="13" fill="#475569" font-weight="400" text-anchor="start" opacity="1">Head moves through the window at lockout</text><rect x="686" y="344.5" width="5" height="5" rx="1.5" fill="#64748b" stroke="none" stroke-width="0" opacity="1"/><text x="697" y="352" font-size="13" fill="#475569" font-weight="400" text-anchor="start" opacity="1">Ribs down, glutes braced; do not lean back</text><text x="697" y="370" font-size="13" fill="#475569" font-weight="400" text-anchor="start" opacity="1">to press</text><rect x="686" y="383.5" width="5" height="5" rx="1.5" fill="#64748b" stroke="none" stroke-width="0" opacity="1"/><text x="697" y="391" font-size="13" fill="#475569" font-weight="400" text-anchor="start" opacity="1">Full lockout keeps tension on the delts and</text><text x="697" y="409" font-size="13" fill="#475569" font-weight="400" text-anchor="start" opacity="1">triceps</text><rect x="686" y="422.5" width="5" height="5" rx="1.5" fill="#64748b" stroke="none" stroke-width="0" opacity="1"/><text x="697" y="430" font-size="13" fill="#475569" font-weight="400" text-anchor="start" opacity="1">Ladder: barbell press, seated dumbbell</text><text x="697" y="448" font-size="13" fill="#475569" font-weight="400" text-anchor="start" opacity="1">press, machine press, landmine press, pike</text><text x="697" y="466" font-size="13" fill="#475569" font-weight="400" text-anchor="start" opacity="1">push-up</text></svg>