<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 880" width="1000" height="880" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><defs><marker id="arrB" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="6.4" markerHeight="6.4" orient="auto"><path d="M1,1 L9,5 L1,9 z" fill="#2563eb"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="6.4" markerHeight="6.4" orient="auto"><path d="M1,1 L9,5 L1,9 z" fill="#64748b"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="6.4" markerHeight="6.4" orient="auto"><path d="M1,1 L9,5 L1,9 z" fill="#e11d48"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="6.4" markerHeight="6.4" orient="auto"><path d="M1,1 L9,5 L1,9 z" fill="#b45309"/></marker></defs><rect x="1" y="1" width="998" height="878" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" opacity="1"/><text x="30" y="46" font-size="22" fill="#0f172a" font-weight="700" text-anchor="start" opacity="1">Allocating a week when some muscles are the priority</text><text x="30" y="72" font-size="13.5" fill="#64748b" font-weight="400" text-anchor="start" opacity="1">Effective hard sets per muscle for a three-day upper, lower, upper split built around a priority. The shaded band is the 10 to 20 set working range.</text><rect x="554.7619047619048" y="114" width="304.7619047619047" height="444" rx="6" fill="#2563eb" stroke="none" stroke-width="0" opacity="0.06"/><line x1="554.7619047619048" y1="114" x2="554.7619047619048" y2="558" stroke="#2563eb" stroke-width="1.6" opacity="0.42" stroke-linecap="round" stroke-dasharray="5 5"/><line x1="859.5238095238095" y1="114" x2="859.5238095238095" y2="558" stroke="#2563eb" stroke-width="1.6" opacity="0.42" stroke-linecap="round" stroke-dasharray="5 5"/><text x="707.1428571428571" y="106" font-size="10.5" fill="#2563eb" font-weight="700" text-anchor="middle" opacity="1">WORKING RANGE, 10 TO 20 SETS</text><line x1="250.0" y1="114" x2="250.0" y2="558" stroke="#cbd5e1" stroke-width="1.4" opacity="1" stroke-linecap="round"/><text x="250.0" y="576" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="middle" opacity="1">0</text><line x1="402.3809523809524" y1="114" x2="402.3809523809524" y2="558" stroke="#cbd5e1" stroke-width="1.4" opacity="1" stroke-linecap="round"/><text x="402.3809523809524" y="576" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="middle" opacity="1">5</text><line x1="554.7619047619048" y1="114" x2="554.7619047619048" y2="558" stroke="#cbd5e1" stroke-width="1.4" opacity="1" stroke-linecap="round"/><text x="554.7619047619048" y="576" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="middle" opacity="1">10</text><line x1="707.1428571428571" y1="114" x2="707.1428571428571" y2="558" stroke="#cbd5e1" stroke-width="1.4" opacity="1" stroke-linecap="round"/><text x="707.1428571428571" y="576" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="middle" opacity="1">15</text><line x1="859.5238095238095" y1="114" x2="859.5238095238095" y2="558" stroke="#cbd5e1" stroke-width="1.4" opacity="1" stroke-linecap="round"/><text x="859.5238095238095" y="576" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="middle" opacity="1">20</text><text x="570.0" y="596" font-size="12" fill="#64748b" font-weight="400" text-anchor="middle" opacity="1">effective hard sets per week</text><text x="238" y="140" font-size="13" fill="#0f172a" font-weight="700" text-anchor="end" opacity="1">Chest</text><rect x="250" y="125" width="335.2380952380952" height="19" rx="0" fill="#fecdd3" stroke="none" stroke-width="0" opacity="1"/><rect x="250" y="125" width="335.2380952380952" height="19" rx="0" fill="#e11d48" stroke="none" stroke-width="0" opacity="1"/><text x="258" y="140" font-size="11" fill="#ffffff" font-weight="700" text-anchor="start" opacity="1">11</text><text x="594.2380952380952" y="140" font-size="12" fill="#e11d48" font-weight="700" text-anchor="start" opacity="1">11</text><text x="238" y="176" font-size="13" fill="#0f172a" font-weight="700" text-anchor="end" opacity="1">Biceps</text><rect x="250" y="161" width="396.19047619047615" height="19" rx="0" fill="#fecdd3" stroke="none" stroke-width="0" opacity="1"/><rect x="250" y="161" width="274.2857142857142" height="19" rx="0" fill="#e11d48" stroke="none" stroke-width="0" opacity="1"/><text x="258" y="176" font-size="11" fill="#ffffff" font-weight="700" text-anchor="start" opacity="1">9</text><text x="655.1904761904761" y="176" font-size="12" fill="#e11d48" font-weight="700" text-anchor="start" opacity="1">13</text><text x="238" y="212" font-size="13" fill="#0f172a" font-weight="700" text-anchor="end" opacity="1">Triceps</text><rect x="250" y="197" width="335.2380952380952" height="19" rx="0" fill="#fecdd3" stroke="none" stroke-width="0" opacity="1"/><rect x="250" y="197" width="243.8095238095238" height="19" rx="0" fill="#e11d48" stroke="none" stroke-width="0" opacity="1"/><text x="258" y="212" font-size="11" fill="#ffffff" font-weight="700" text-anchor="start" opacity="1">8</text><text x="594.2380952380952" y="212" font-size="12" fill="#e11d48" font-weight="700" text-anchor="start" opacity="1">11</text><text x="238" y="248" font-size="13" fill="#475569" font-weight="400" text-anchor="end" opacity="1">Back and lats</text><rect x="250" y="233" width="243.8095238095238" height="19" rx="0" fill="#cbd5e1" stroke="none" stroke-width="0" opacity="1"/><rect x="250" y="233" width="243.8095238095238" height="19" rx="0" fill="#64748b" stroke="none" stroke-width="0" opacity="1"/><text x="258" y="248" font-size="11" fill="#ffffff" font-weight="700" text-anchor="start" opacity="1">8</text><text x="502.8095238095238" y="248" font-size="12" fill="#475569" font-weight="600" text-anchor="start" opacity="1">8</text><text x="238" y="284" font-size="13" fill="#475569" font-weight="400" text-anchor="end" opacity="1">Hamstrings</text><rect x="250" y="269" width="182.85714285714283" height="19" rx="0" fill="#cbd5e1" stroke="none" stroke-width="0" opacity="1"/><rect x="250" y="269" width="182.85714285714283" height="19" rx="0" fill="#64748b" stroke="none" stroke-width="0" opacity="1"/><text x="258" y="284" font-size="11" fill="#ffffff" font-weight="700" text-anchor="start" opacity="1">6</text><text x="441.85714285714283" y="284" font-size="12" fill="#475569" font-weight="600" text-anchor="start" opacity="1">6</text><text x="238" y="320" font-size="13" fill="#475569" font-weight="400" text-anchor="end" opacity="1">Lateral deltoid</text><rect x="250" y="305" width="182.85714285714283" height="19" rx="0" fill="#cbd5e1" stroke="none" stroke-width="0" opacity="1"/><rect x="250" y="305" width="91.42857142857144" height="19" rx="0" fill="#64748b" stroke="none" stroke-width="0" opacity="1"/><text x="258" y="320" font-size="11" fill="#ffffff" font-weight="700" text-anchor="start" opacity="1">3</text><text x="441.85714285714283" y="320" font-size="12" fill="#475569" font-weight="600" text-anchor="start" opacity="1">6</text><text x="238" y="356" font-size="13" fill="#475569" font-weight="400" text-anchor="end" opacity="1">Posterior deltoid</text><rect x="250" y="341" width="182.85714285714283" height="19" rx="0" fill="#cbd5e1" stroke="none" stroke-width="0" opacity="1"/><rect x="250" y="341" width="60.95238095238096" height="19" rx="0" fill="#64748b" stroke="none" stroke-width="0" opacity="1"/><text x="258" y="356" font-size="11" fill="#ffffff" font-weight="700" text-anchor="start" opacity="1">2</text><text x="441.85714285714283" y="356" font-size="12" fill="#475569" font-weight="600" text-anchor="start" opacity="1">6</text><text x="238" y="392" font-size="13" fill="#475569" font-weight="400" text-anchor="end" opacity="1">Anterior deltoid</text><rect x="250" y="377" width="152.3809523809524" height="19" rx="0" fill="#cbd5e1" stroke="none" stroke-width="0" opacity="1"/><rect x="250" y="377" width="60.95238095238096" height="19" rx="0" fill="#64748b" stroke="none" stroke-width="0" opacity="1"/><text x="258" y="392" font-size="11" fill="#ffffff" font-weight="700" text-anchor="start" opacity="1">2</text><text x="411.3809523809524" y="392" font-size="12" fill="#475569" font-weight="600" text-anchor="start" opacity="1">5</text><text x="238" y="428" font-size="13" fill="#475569" font-weight="400" text-anchor="end" opacity="1">Rotator cuff</text><rect x="250" y="413" width="60.95238095238096" height="19" rx="0" fill="#cbd5e1" stroke="none" stroke-width="0" opacity="1"/><rect x="250" y="413" width="60.95238095238096" height="19" rx="0" fill="#64748b" stroke="none" stroke-width="0" opacity="1"/><text x="258" y="428" font-size="11" fill="#ffffff" font-weight="700" text-anchor="start" opacity="1">2</text><text x="319.95238095238096" y="428" font-size="12" fill="#475569" font-weight="600" text-anchor="start" opacity="1">2</text><text x="238" y="464" font-size="13" fill="#475569" font-weight="400" text-anchor="end" opacity="1">Quadriceps</text><rect x="250" y="449" width="137.1428571428571" height="19" rx="0" fill="#cbd5e1" stroke="none" stroke-width="0" opacity="1"/><rect x="250" y="449" width="91.42857142857144" height="19" rx="0" fill="#64748b" stroke="none" stroke-width="0" opacity="1"/><text x="258" y="464" font-size="11" fill="#ffffff" font-weight="700" text-anchor="start" opacity="1">3</text><text x="396.1428571428571" y="464" font-size="12" fill="#475569" font-weight="600" text-anchor="start" opacity="1">4.5</text><text x="238" y="500" font-size="13" fill="#475569" font-weight="400" text-anchor="end" opacity="1">Calves</text><rect x="250" y="485" width="91.42857142857144" height="19" rx="0" fill="#cbd5e1" stroke="none" stroke-width="0" opacity="1"/><rect x="250" y="485" width="91.42857142857144" height="19" rx="0" fill="#64748b" stroke="none" stroke-width="0" opacity="1"/><text x="258" y="500" font-size="11" fill="#ffffff" font-weight="700" text-anchor="start" opacity="1">3</text><text x="350.42857142857144" y="500" font-size="12" fill="#475569" font-weight="600" text-anchor="start" opacity="1">3</text><text x="238" y="536" font-size="13" fill="#475569" font-weight="400" text-anchor="end" opacity="1">Glute max</text><rect x="250" y="521" width="91.42857142857144" height="19" rx="0" fill="#cbd5e1" stroke="none" stroke-width="0" opacity="1"/><text x="350.42857142857144" y="536" font-size="12" fill="#475569" font-weight="600" text-anchor="start" opacity="1">3</text><rect x="60" y="610" width="13" height="13" rx="2" fill="#e11d48" stroke="none" stroke-width="0" opacity="1"/><text x="82" y="621" font-size="12" fill="#475569" font-weight="400" text-anchor="start" opacity="1">priority muscle, direct sets</text><rect x="278" y="610" width="13" height="13" rx="2" fill="#64748b" stroke="none" stroke-width="0" opacity="1"/><text x="300" y="621" font-size="12" fill="#475569" font-weight="400" text-anchor="start" opacity="1">other muscle, direct sets</text><rect x="478" y="610" width="13" height="13" rx="2" fill="#cbd5e1" stroke="none" stroke-width="0" opacity="1"/><text x="500" y="621" font-size="12" fill="#475569" font-weight="400" text-anchor="start" opacity="1">indirect sets, counted at half</text><text x="60" y="658" font-size="12.5" fill="#0f172a" font-weight="700" text-anchor="start" opacity="1">THE PRIORITY GETS DIRECT WORK, NOT JUST MORE SETS</text><text x="60" y="677" font-size="12.5" fill="#475569" font-weight="400" text-anchor="start" opacity="1">Every priority muscle carries a dedicated slot. The share of the week that is direct work is what separates a</text><text x="60" y="695" font-size="12.5" fill="#475569" font-weight="400" text-anchor="start" opacity="1">priority from a muscle that is merely trained along the way.</text><text x="60" y="725" font-size="12.5" fill="#0f172a" font-weight="700" text-anchor="start" opacity="1">THE SHADED BAND IS A RANGE, NOT A TARGET</text><text x="60" y="744" font-size="12.5" fill="#475569" font-weight="400" text-anchor="start" opacity="1">The priority muscles sit at the low end of the band, because the session is capped at about fifty minutes. The</text><text x="60" y="762" font-size="12.5" fill="#475569" font-weight="400" text-anchor="start" opacity="1">muscles that fall short of it are the ones to raise first when a slot opens, and they are named in the worked</text><text x="60" y="780" font-size="12.5" fill="#475569" font-weight="400" text-anchor="start" opacity="1">example.</text><text x="60" y="810" font-size="12.5" fill="#0f172a" font-weight="700" text-anchor="start" opacity="1">COUNTING RULE</text><text x="60" y="829" font-size="12.5" fill="#475569" font-weight="400" text-anchor="start" opacity="1">A direct set counts as 1 and an indirect set counts as 0.5, which fitted the published dose-response data better</text><text x="60" y="847" font-size="12.5" fill="#475569" font-weight="400" text-anchor="start" opacity="1">than the alternatives [Pelland et al., 2026].</text></svg>